name: Exception on merge
on: pull_request

jobs:
  check-merge:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      with: 
        fetch-depth: 7

    - name: Get commit range and log event name
      id: commit_range
      run: |
        echo "##[group]Determining commit range and logging event name"
        echo "GitHub event name: $GITHUB_EVENT_NAME"
        echo "from=${{ github.event.before }}" >> $GITHUB_OUTPUT
        echo "to=${{ github.sha }}" >> $GITHUB_OUTPUT
        echo "##[endgroup]"

    - name: Check for real merge commits
      id: check_merge
      run: |
        echo "##[group]Checking for real merge commits"
        COMMITS=$(git rev-list ${{ steps.commit_range.outputs.from }}..${{ steps.commit_range.outputs.to }})
        echo "Commits in the push: $COMMITS"
        MERGE_FOUND=false
        for COMMIT in $COMMITS; do
          if git cat-file -t $COMMIT >/dev/null 2>&1; then
            PARENTS=$(git log -1 --pretty=%P $COMMIT)
            PARENT_COUNT=$(echo $PARENTS | wc -w)
            if [[ $PARENT_COUNT -gt 1 ]]; then
              echo "merge=true" >> $GITHUB_OUTPUT
              echo "Merge commit found: $COMMIT"
              MERGE_FOUND=true
              break
            fi
          else
            echo "Warning: Commit $COMMIT does not exist in history"
          fi
        done
        if [[ $MERGE_FOUND == false ]]; then
          echo "merge=false" >> $GITHUB_OUTPUT
          echo "No real merge commits found"
        fi
        echo "##[endgroup]"

    - name: Run actions if a real merge commit is detected
      if: steps.check_merge.outputs.merge == 'true'
      run: |
        echo "Running actions for real merge commits..."
        # Add your actions here

    - name: Run actions if no real merge commit is detected
      if: steps.check_merge.outputs.merge == 'false'
      run: |
        echo "Running actions for non-merge commits..."
        # Add your actions here
