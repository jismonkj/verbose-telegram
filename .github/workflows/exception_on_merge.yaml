name: Exception on merge
on: pull_request

jobs:
  check-merge:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      with:
        fetch-depth: 5  # Fetch the last 20 commits

    - name: Check for merge commits using GitHub Script
      id: check_merge
      uses: actions/github-script@v6
      with:
        script: |
          const commitList = await github.rest.repos.listCommits({
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 7, // Adjust as needed
            sha: context.payload.before
          });

          let mergeFound = false;
          for (const commit of commitList.data) {
            if (commit.parents.length > 1) {
              mergeFound = true;
              core.setOutput('merge', 'true');
              console.log(`Merge commit found: ${commit.sha}`);
              break;
            }
          }

          if (!mergeFound) {
            core.setOutput('merge', 'false');
            console.log("No merge commits found");
          }

    - name: Run actions if a merge commit is detected
      if: steps.check_merge.outputs.merge == 'true'
      run: |
        echo "Running actions for merge commits..."
        # Add your actions here

    - name: Run actions if no merge commit is detected
      if: steps.check_merge.outputs.merge == 'false'
      run: |
        echo "Running actions for non-merge commits..."
        # Add your actions here
